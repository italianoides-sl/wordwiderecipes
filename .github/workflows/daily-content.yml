name: Daily Content Generation

on:
  schedule:
    - cron: '0 7 * * *'  # 08:00 Madrid (UTC+1)
  workflow_dispatch:       # también manual desde GitHub

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate daily content
        run: npx tsx scripts/generate-content.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: gpt-4o-mini
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEXT_PUBLIC_BASE_URL: https://worldwiderecipes.app

      - name: Update homepage
        run: |
          curl -X GET "${{ secrets.BASE_URL }}/api/cron/update-homepage" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120

      - name: Update sitemaps
        run: |
          curl -X GET "${{ secrets.BASE_URL }}/api/cron/update-sitemaps" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120
