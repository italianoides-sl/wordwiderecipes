name: Daily Content Generation

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Call daily content route
        run: |
          curl -X POST "${{ secrets.BASE_URL }}/api/cron/daily-content" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 180
